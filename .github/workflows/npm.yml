name: npm

on:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  # Keep pending stable releases when more main pushes arrive (up to 100 queued runs).
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tuuject/surowan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate release ref and choose version
        id: release
        run: node scripts/npm-release.ts

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund

      - run: pnpm install --frozen-lockfile
      - run: pnpm run cli:check
      - run: pnpm test test/invocation-cli.test.ts test/npm-release.test.ts

      # Change only the disposable checkout; the tag is the stable version source.
      - name: Set package version
        working-directory: packages/cli
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts --workspaces=false

      - name: Pack CLI
        run: pnpm --filter @tuuject/plasticwan-utils pack --pack-destination "$RUNNER_TEMP/npm-release"

      - name: Inspect publish payload
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: |
          packages=("$RUNNER_TEMP/npm-release/"*.tgz)
          test "${#packages[@]}" -eq 1
          npm stage publish "${packages[0]}" --dry-run --access public --tag "$DIST_TAG" --ignore-scripts

      # No npm token: npm exchanges this job's OIDC identity with the registry.
      # The trusted publisher only allows staging; a maintainer approves with 2FA.
      - name: Stage npm publish
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: |
          packages=("$RUNNER_TEMP/npm-release/"*.tgz)
          test "${#packages[@]}" -eq 1
          npm stage publish "${packages[0]}" --access public --tag "$DIST_TAG" --ignore-scripts --provenance
