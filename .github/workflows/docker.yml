name: Docker

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: TypeScript check
        run: pnpm run check

      - name: Tests
        run: pnpm test

      - name: Build admin panel
        run: pnpm run admin:build

      - name: Install Playwright chromium
        run: pnpm --filter plasticwan-admin-next exec playwright install --with-deps chromium

      - name: Admin panel E2E
        run: pnpm run admin:test:e2e

  # Other branches only verify; images are built for main and release tags.
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Next version
        id: next
        run: echo "version=0.0.0-next-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.next.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tags pushed with GITHUB_TOKEN do not trigger workflows, so this does not rebuild.
      - name: Create pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.next.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.next.outputs.version }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --prerelease
          --generate-notes
          --notes "Docker image: \`$IMAGE\`"
