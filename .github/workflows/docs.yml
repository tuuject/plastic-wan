name: Documentation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: root
            base: /
          - name: subpath
            base: /surowan/
    env:
      # Verification artifacts are not a public deployment.
      DOCS_SITE_ORIGIN: https://docs.example.com
      DOCS_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm test test/docs-examples.test.ts test/docs-search.test.ts
      - run: pnpm run docs:build
      - run: pnpm run docs:verify
      - name: Ensure generated files stay ignored
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.name }}-${{ github.sha }}
          path: apps/docs/dist/
          if-no-files-found: error
          retention-days: 7

  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the unchanged Bot image with the shared lockfile
        run: docker build -t plasticwan:docs-check .
      - name: Ensure docs are not shipped in the Bot image
        run: >-
          docker run --rm --entrypoint node plasticwan:docs-check
          --input-type=module -e
          "import { existsSync } from 'node:fs';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          if (existsSync('/app/apps/docs')) throw new Error('Docs leaked into runtime');
          let found = false;
          try { require.resolve('@rspress/core'); found = true; }
          catch (error) { if (error.code !== 'MODULE_NOT_FOUND') throw error; }
          if (found) throw new Error('Rspress leaked into runtime');"
